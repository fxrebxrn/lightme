[project]
name = "lightme-bot"
version = "2.0.0"
description = "LightMe - Telegram bot with power outage schedules (ДТЕК/ЦЕК)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiogram==3.26.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic-settings>=2.6",
    "apscheduler>=3.10,<4",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
redis = ["redis>=5.0"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
extend-exclude = ["migrations/versions"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"app/i18n/*" = ["E501"]
"tests/*" = ["E501"]
